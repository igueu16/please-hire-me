<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px -apple-system, system-ui, sans-serif; width: 300px; margin: 12px; color: #1d1d1f; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  .resume { background: #f3f4f6; border-radius: 6px; padding: 8px; margin-bottom: 10px; word-break: break-word; }
  .resume b { display: block; margin-bottom: 2px; }
  button { width: 100%; padding: 9px; border: 0; border-radius: 6px; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
  #go { background: #2563eb; color: #fff; }
  #stop { background: #e5e7eb; }
  .note { color: #6b7280; font-size: 11px; margin-top: 6px; }
  .bad { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Workday Autofill</h1>
  <div class="resume" id="resume">Checking this page…</div>
  <button id="go">Autofill this application</button>
  <button id="stop">Stop</button>
  <button id="export">Export learned answers (<span id="nlearn">0</span>)</button>
  <div class="note">Fills each step as it loads. You review, click Save and Continue, and press Submit yourself. It never submits.</div>
  <script src="popup.js"></script>
</body>
</html>
